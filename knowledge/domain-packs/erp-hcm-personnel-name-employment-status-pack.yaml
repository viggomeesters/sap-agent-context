  - id: sap.object.erp-hcm-personnel-name-and-employment-status
    title: ERP HCM personnel name and employment-status tables
    kind: sap_object
    status: active
    access: public
    requires_login: false
    sap_product: erp_hcm
    topics: [hcm, pa, pa0000, pa0001, pa0002, pernr, ename, sname, vorna, nachn, stat2]
    used_for: [technical_table_lookup, data_extraction, consultant_answer]
    summary: >
      Resolve PERNR to name through PA0002 for structured name components
      (VORNA/NACHN); PA0001 can provide the formatted organizational-assignment
      name field ENAME/SNAME where present. Read employment status from the
      date-valid PA0000 Actions record in STAT2. Join on PERNR and select the
      record valid on the reporting key date using BEGDA and ENDDA.
    freshness: *freshness
    source: *personal_data_source
    requires_source_specificity: high
    release_applicability:
      edition: erp_hcm
      verification: >
        Verify target DDIC, key-date logic, concurrent employment/personnel
        assignments and authorization before using HR personal data.
    claims:
      - statement: PA0002 stores structured employee name data including VORNA and NACHN.
        evidence:
          - https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/ba566f6093324c6b8acbd431787ca8ef/90e5a853c55e0077e10000000a4450e5.html
      - statement: PA0000-STAT2 is the employment-status field on the Actions infotype.
        evidence:
          - https://help.sap.com/docs/ERP_HCM/d3bc4479e3344626be836c03a5c6962f/4fc8757f4ff943b2e10000000a42189b.html
          - https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/84bfedb215ae482c80851d00ac2ee7f2/81c5c353b677b44ce10000000a174cb4.html
    relations:
      references: [sap.ref.erp-hcm-infotype-0002-name-fields]
      rules: [sap.rule.erp-hcm-personnel-name-status-key-date-join]

  - id: sap.rule.erp-hcm-personnel-name-status-key-date-join
    title: Join PERNR to date-valid HCM name and employment status
    kind: decision_rule
    status: active
    access: public
    requires_login: false
    sap_product: erp_hcm
    topics: [hcm, pa, pa0000, pa0001, pa0002, pernr, stat2, begda, endda, key-date]
    used_for: [technical_table_lookup, data_extraction, consultant_answer]
    summary: >
      Join PA0000 and PA0002 on PERNR and select records where the reporting key
      date lies between BEGDA and ENDDA. Use PA0002-VORNA/NACHN for structured
      name components. Use PA0000-STAT2 for employment status: standard values
      are 0 withdrawn/left, 1 inactive, 2 pensioner/retiree and 3 active. PA0001
      ENAME/SNAME is a convenient formatted-name alternative when that infotype
      is already in the extraction.
    freshness: *freshness
    source: *actions_source
    requires_source_specificity: high
    claims:
      - statement: >
          Employment status must be read from the PA0000 record valid on the key
          date; standard STAT2 values distinguish withdrawn, inactive, pensioner
          and active employees.
        evidence:
          - https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/84bfedb215ae482c80851d00ac2ee7f2/81c5c353b677b44ce10000000a174cb4.html
          - https://help.sap.com/docs/ERP_HCM/d3bc4479e3344626be836c03a5c6962f/4fc8757f4ff943b2e10000000a42189b.html
    rules:
      - condition: A personnel number must be enriched with name and current employment status.
        value_source: PA0002-PERNR/VORNA/NACHN and PA0000-PERNR/STAT2/BEGDA/ENDDA
        outcome: Join on PERNR and filter both infotypes to the reporting key date.
        owner: SAP HCM data extraction owner
      - condition: A formatted display name is sufficient and PA0001 is already selected.
        value_source: PA0001-ENAME or PA0001-SNAME plus PA0001-BEGDA/ENDDA
        outcome: Use the date-valid PA0001 formatted name; keep PA0002 for separate first/last-name components.
        owner: SAP HCM data extraction owner
      - condition: The extraction is used as employment or headcount truth.
        value_source: Target-system PA0000 action history, status customizing and reporting key date
        outcome: Validate target release/customizing, concurrent employment and authorization; do not infer status from record presence alone.
        owner: SAP HCM functional owner
    relations:
      objects: [sap.object.erp-hcm-personnel-name-and-employment-status]

  - id: sap.test-pattern.question-pa0000-person-name-employment-status
    title: Exact question - PA0000 personnel name and employment status
    kind: test_pattern
    status: active
    access: internal_derived
    requires_login: false
    sap_product: erp_hcm
    topics: [hcm, pa0000, pa0001, pa0002, pernr, name, dienstverband, employment-status]
    used_for: [consultant_answer, regression_test, question_provenance]
    summary: >
      Gestelde vraag: "Zie onderstaand een overzicht van SAP personeelsnummers.
      Kun jij hier de naam van die persoon bijzoeken en de status van dienstverband?
      In PA0000 vind ik alleen personal nr." Verwacht antwoord: koppel PERNR aan
      de datumgeldige PA0002-record voor VORNA/NACHN (of PA0001 ENAME/SNAME voor
      een opgemaakte naam) en lees PA0000-STAT2 uit de datumgeldige Actions-record.
    freshness: *freshness
    source:
      kind: internal_pattern
      title: User question captured for SAP Agent Context curation
      url: ""
      retrieved_at: 2026-08-11
      specificity: internal_pattern
      license_note: Public-safe generic user question; no personnel numbers or personal data stored.
    claims:
      - statement: >
          A ready answer must name PA0002 VORNA/NACHN, PA0000 STAT2, PERNR and
          BEGDA/ENDDA; PA0001 ENAME/SNAME may be stated as a formatted-name shortcut.
        evidence:
          - sap.object.erp-hcm-personnel-name-and-employment-status
          - sap.rule.erp-hcm-personnel-name-status-key-date-join
    relations:
      objects: [sap.object.erp-hcm-personnel-name-and-employment-status]
      rules: [sap.rule.erp-hcm-personnel-name-status-key-date-join]
    test_scenarios:
      - level: acceptance
        case: Ask which tables enrich PA0000 personnel numbers with names and employment status.
        expected: Answer names PA0002, VORNA, NACHN, PA0000, STAT2, PERNR, BEGDA and ENDDA.
      - level: negative
        case: Ask generally what PA0000 contains without requesting name or employment-status enrichment.
        expected: Do not promote the question to this ready extraction answer.
